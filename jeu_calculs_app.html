<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu des Calculs</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--accent:#607d8b;--text:#333}
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Segoe UI;background:linear-gradient(135deg,#f5f5f5,#e0e0e0)}
.container{background:var(--card);padding:35px;border-radius:25px;width:90%;max-width:480px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.15)}
h1{color:var(--accent)}
.hidden{display:none}
.btn{padding:14px 26px;margin:8px;border:none;border-radius:30px;font-weight:bold;background:linear-gradient(135deg,#9e9e9e,#607d8b);color:#fff;cursor:pointer}
#question{font-size:34px;margin:20px 0}
input{width:80%;padding:14px;font-size:22px;border-radius:14px;border:2px solid #bdbdbd;text-align:center}
#lives{margin:10px;font-size:22px}
.timer{height:10px;background:#ddd;border-radius:6px;overflow:hidden;margin-top:15px}
.bar{height:100%;background:linear-gradient(90deg,#b0bec5,#607d8b);width:100%}
.life-loss{animation:pop .3s}@keyframes pop{50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="container">
<h1>Jeu des Calculs</h1>

<!-- MENU -->
<div id="menu">
  <h3>Choisis ton mode</h3>
  <button class="btn" data-mode="classique">Mode Classique</button>
  <button class="btn" data-mode="chrono">Contre‑la‑montre</button>
</div>

<!-- NIVEAUX -->
<div id="levels" class="hidden">
  <h3 id="mode-title"></h3>
  <button class="btn" data-level="Débutant">Débutant</button>
  <button class="btn" data-level="Intermédiaire">Intermédiaire</button>
  <button class="btn" data-level="Avancé">Avancé</button>
  <button class="btn" data-level="Légende">Légende</button>
</div>

<!-- JEU -->
<div id="game" class="hidden">
  <div id="lives"></div>
  <div>Score : <span id="score">0</span> | Record : <span id="high">0</span></div>
  <div id="question"></div>
  <input id="answer" inputmode="decimal">
  <button class="btn" id="validate">Valider</button>
  <div class="timer"><div id="bar" class="bar"></div></div>
</div>

<!-- FIN -->
<div id="end" class="hidden">
  <h2>Partie terminée</h2>
  <p>Score : <strong id="final"></strong></p>
  <button class="btn" id="replay">Rejouer</button>
  <button class="btn" id="back-menu">Changer de mode</button>
</div>
</div>

<script>
'use strict';
let mode=null,level=null,score=0,errors=0,answer=0,time=0,timer=null,streak=0,lastWrong=false;
let high=Number(localStorage.getItem('highScore')||0);

const levels={Débutant:[2,10],Intermédiaire:[5,20],Avancé:[10,50],Légende:[10,99]};

const menu=document.getElementById('menu'),levelsDiv=document.getElementById('levels'),game=document.getElementById('game'),end=document.getElementById('end');

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}

function startGame(){
  score=0;errors=0;streak=0;lastWrong=false;
  time=(mode==='chrono')?120:30;
  document.getElementById('score').innerText=0;
  document.getElementById('high').innerText=high;
  levelsDiv.classList.add('hidden');game.classList.remove('hidden');end.classList.add('hidden');
  updateLives();next();startTimer();
}

function next(){
  const [a,b]=levels[level];
  const x=rand(a,b),y=rand(a,b);
  answer=x*y;
  document.getElementById('question').innerText=`${x} × ${y}`;
  document.getElementById('answer').value='';
  if(mode==='classique') time=30;
}

function startTimer(){clearInterval(timer);timer=setInterval(()=>{time-=0.1;updateBar();if(time<=0)endGame()},100)}
function updateBar(){document.getElementById('bar').style.width=Math.max(0,time/(mode==='chrono'?120:30)*100)+'%'}

function validate(){
  const v=Number(document.getElementById('answer').value.replace(',','.'));
  if(!Number.isFinite(v))return;
  if(v===answer){
    score++;streak++;
    if(mode==='chrono'){let add=7;if(streak>=3)add+=5;time+=add}
    else{errors=0}
    next();
  }else{
    if(mode==='chrono'){time-=lastWrong?17:12;lastWrong=true;streak=0}
    else{errors++;animateLife();updateLives();if(errors>=2)return endGame()}
  }
  lastWrong=false;
  document.getElementById('score').innerText=score;
  if(score>high){high=score;localStorage.setItem('highScore',high);document.getElementById('high').innerText=high}
}

function updateLives(){document.getElementById('lives').innerText=(mode==='classique')?(errors===0?'❤️❤️':errors===1?'❤️🤍':'🤍🤍'):''}
function animateLife(){const l=document.getElementById('lives');l.classList.add('life-loss');setTimeout(()=>l.classList.remove('life-loss'),300)}
function endGame(){clearInterval(timer);game.classList.add('hidden');end.classList.remove('hidden');document.getElementById('final').innerText=score}

// EVENTS
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu.classList.add('hidden');levelsDiv.classList.remove('hidden');document.getElementById('mode-title').innerText=(mode==='classique'?'Mode Classique':'Contre‑la‑montre')});
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;startGame()});
document.getElementById('validate').onclick=validate;
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')validate()});
document.getElementById('replay').onclick=startGame;
document.getElementById('back-menu').onclick=()=>{end.classList.add('hidden');menu.classList.remove('hidden')};
</script>
</body>
</html>
